<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f2f3ef">
  <title>Minha lista de tarefas</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">ORGANIZE SEU DIA</p>
      <h1>Minha lista de tarefas</h1>
      <p class="subtitle">Um passo de cada vez. Você consegue!</p>
    </header>

    <section class="card task-form-card" aria-labelledby="form-title">
      <h2 id="form-title">Adicionar tarefa</h2>
      <form id="task-form">
        <label for="task-input">O que você precisa fazer?</label>
        <div class="input-row">
          <input
            id="task-input"
            name="task"
            type="text"
            placeholder="Ex.: organizar a mesa"
            autocomplete="off"
            maxlength="120"
            required
          >
          <button class="add-button" type="submit">Adicionar</button>
        </div>
      </form>
    </section>

    <section class="card task-list-card" aria-labelledby="list-title">
      <div class="list-heading">
        <h2 id="list-title">Suas tarefas</h2>
        <span id="task-count" class="task-count">0 tarefas</span>
      </div>
      <p class="task-instruction">Marque a caixa ao lado da tarefa para concluí-la. Clique novamente para desmarcar.</p>
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">Nenhuma tarefa por aqui. Adicione a primeira!</p>
    </section>
  </main>
</body>
</html>
